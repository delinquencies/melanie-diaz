# Salon OS on Cloudflare (Workers + Durable Object SQLite + R2 + Static Assets).
# Deploying this does NOT touch melanie-diaz.com — it is a separate Worker.
name = "melanie-diaz-salon-os"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Private by default: no public *.workers.dev URL.
# Attach a custom domain (e.g. os.melanie-diaz.com) and put Cloudflare Access in front of it — see SALON_OS.md.
workers_dev = false
# routes = [{ pattern = "os.melanie-diaz.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SALON"
class_name = "SalonOS"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalonOS"]

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "melanie-diaz-salon-os-photos"

[triggers]
crons = ["*/30 * * * *"]   # Google Calendar free/busy sync (no-op until a calendar is connected)

[vars]
NODE_ENV = "production"     # Secure cookies; requires SALON_OS_DATA_KEY
PUBLIC_INTAKE = "off"       # Client intake submissions disabled until Melanie approves the form

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   SALON_OS_DATA_KEY       32-byte base64 encryption key (back it up!)
#   SETUP_TOKEN             one-time token to create the owner account
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI   (when connecting Google Calendar)
